const catMap={'패키지':{cls:'pkg',color:'var(--pkg)'},'솔로 이벤트':{cls:'solo',color:'var(--solo)'},'시즌 패스':{cls:'pass',color:'var(--pass)'},'접속 이벤트':{cls:'login',color:'var(--login)'},'기타':{cls:'etc',color:'var(--etc)'}};
const activeCats=new Set(Object.keys(catMap));
const parse=s=>new Date(s+'T00:00:00');
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
// footer 기준일을 오늘 날짜로 표시
(()=>{ const el=document.getElementById('footerRef'); if(el) el.textContent=`기준일: ${fmt(TODAY)} · 원본: 이벤트 스캐쥴.xlsx`; })();
const diff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const status=e=>{if(parse(e.end)<parse(e.start))return'invalid';if(TODAY<parse(e.start))return'upcoming';if(TODAY>parse(e.end))return'ended';return'live'};
let currentMonth='2026-07', currentView='timeline';
const months=(()=>{const out=[];for(let m=1;m<=12;m++)out.push(`2026-${String(m).padStart(2,'0')}`);return out})();
monthSelect.innerHTML=months.map(m=>`<option value="${m}">${m.replace('-','년 ')}월</option>`).join('');
monthSelect.value=currentMonth;
legend.innerHTML=Object.entries(catMap).map(([k,v])=>`<div class="chip" data-cat="${k}"><span class="dot" style="background:${v.color}"></span>${k}</div>`).join('');
function getFiltered(){const q=search.value.trim().toLowerCase(),st=statusSelect.value;return events.filter(e=>activeCats.has(e.cat)&&(!q||e.name.toLowerCase().includes(q))&&(st==='all'||status(e)===st));}
function monthBounds(){const [y,m]=currentMonth.split('-').map(Number);return [new Date(y,m-1,1),new Date(y,m,0)]}
function renderStats(){const visible=getFiltered(),live=events.filter(e=>status(e)==='live').length,up=events.filter(e=>status(e)==='upcoming').length,bad=events.filter(e=>status(e)==='invalid').length;stats.innerHTML=[['전체 일정',events.length,'엑셀 데이터 기준'],['진행 중',live,fmt(TODAY)+' 기준'],['예정 일정',up,'앞으로 시작'],['데이터 확인',bad,bad?'종료일 역전 항목':'이상 없음']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="hint">${x[2]}</div></div>`).join('')}
function renderTimeline(){
  const finite=events.filter(e=>e.end<'2099'&&status(e)!=='invalid');
  const start=new Date('2026-07-20');
  const end=new Date('2026-12-31');
  const days=Math.round((end-start)/86400000)+1;
  timeline.style.setProperty('--days',days);
  timeline.style.minWidth=`${220+days*38}px`;

  const monthSpans=[];let cursor=new Date(start);
  while(cursor<=end){
    const y=cursor.getFullYear(),m=cursor.getMonth();let count=0;
    while(cursor<=end&&cursor.getFullYear()===y&&cursor.getMonth()===m){count++;cursor.setDate(cursor.getDate()+1)}
    monthSpans.push({label:`${y}년 ${m+1}월`,count});
  }

  let html=`<div class="months"><div class="label-space">일정 / 카테고리</div>${monthSpans.map(x=>`<div class="month-name" style="grid-column:span ${x.count}">${x.label}</div>`).join('')}</div><div class="days"><div class="name">전체 운영 기간</div>`;
  for(let i=0;i<days;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    html+=`<div class="day ${[0,6].includes(d.getDay())?'weekend':''} ${fmt(d)===fmt(TODAY)?'today':''}">${d.getDate()}</div>`;
  }
  html+='</div>';

  const filtered=getFiltered();
  for(const cat of Object.keys(catMap)){
    const catEvents=filtered
      .filter(e=>e.cat===cat&&parse(e.start)<=end&&parse(e.end)>=start)
      .sort((a,b)=>parse(a.start)-parse(b.start)||parse(a.end)-parse(b.end));
    if(!catEvents.length)continue;

    // 종료일도 하루 전체 운영으로 포함하므로, 다음 일정 시작일이 이전 종료일보다
    // 늦을 때만 같은 행에 배치한다. 같은 날짜 경계는 실제로 하루가 겹친다.
    const lanes=[];
    catEvents.forEach(e=>{
      const es=parse(e.start), ee=status(e)==='invalid'?es:parse(e.end);
      let laneIndex=lanes.findIndex(lane=>es>lane.end);
      if(laneIndex<0){laneIndex=lanes.length;lanes.push({end:ee,items:[]});}
      lanes[laneIndex].items.push(e);
      if(ee>lanes[laneIndex].end)lanes[laneIndex].end=ee;
    });

    html+=`<div class="group-title">${cat} · ${catEvents.length}개 일정 · ${lanes.length}개 행</div>`;
    lanes.forEach((lane,laneIndex)=>{
      html+=`<div class="row"><div class="row-label compact"><strong>${cat}${lanes.length>1?` ${laneIndex+1}`:''}</strong><span>${lane.items.length}개 일정</span></div>`;
      for(let i=0;i<days;i++){
        const d=new Date(start);d.setDate(d.getDate()+i);
        html+=`<div class="cell ${[0,6].includes(d.getDay())?'weekend':''}"></div>`;
      }
      lane.items.forEach(e=>{
        const invalid=status(e)==='invalid';
        const visualEnd=invalid?parse(e.start):parse(e.end);
        const clampedStart=new Date(Math.max(parse(e.start),start));
        const clampedEnd=new Date(Math.min(visualEnd,end));
        const offset=Math.max(0,Math.round((clampedStart-start)/86400000));
        // 시작일과 종료일을 모두 포함: 7/22~7/28은 7일 칸 전체를 사용한다.
        const span=Math.max(1,Math.round((clampedEnd-clampedStart)/86400000)+1);
        html+=`<div class="bar ${catMap[e.cat].cls} ${invalid?'invalid':''}" style="--start:${offset};--span:${span}" data-name="${e.name}" title="${e.name} · ${e.start} ~ ${e.end}">${e.name}</div>`;
      });
      html+='</div>';
    });
  }

  const todayOffset=Math.round((TODAY-start)/86400000);
  if(todayOffset>=0&&todayOffset<days)html+=`<div class="today-line" style="--today-offset:${todayOffset}"></div>`;
  timeline.innerHTML=html;
  timeline.style.display='block';calendar.style.display='none';
  rangeLabel.textContent=`전체 기간 · ${fmt(start)} ~ ${fmt(end)} · 종료일 포함`;
  bindEvents();
}
function renderCalendar(){
  const [first,last]=monthBounds();
  const gridStart=new Date(first);gridStart.setDate(1-first.getDay());
  const gridEnd=new Date(last);gridEnd.setDate(last.getDate()+(6-last.getDay()));
  const filtered=getFiltered().filter(e=>status(e)!=='invalid');
  let html='<div class="calendar-board"><div class="calendar-weekdays">'+['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')+'</div>';
  for(let weekStart=new Date(gridStart);weekStart<=gridEnd;weekStart.setDate(weekStart.getDate()+7)){
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
    const segments=[];
    filtered.forEach(e=>{
      const es=parse(e.start),ee=parse(e.end);
      if(es>weekEnd||ee<weekStart)return;
      const segStart=new Date(Math.max(es,weekStart));const segEnd=new Date(Math.min(ee,weekEnd));
      segments.push({e,startCol:segStart.getDay()+1,span:Math.round((segEnd-segStart)/86400000)+1,contBefore:es<weekStart,contAfter:ee>weekEnd,start:segStart,end:segEnd});
    });
    segments.sort((a,b)=>a.startCol-b.startCol||b.span-a.span||a.e.name.localeCompare(b.e.name));
    const laneEnds=[];
    segments.forEach(seg=>{let lane=laneEnds.findIndex(endCol=>seg.startCol>endCol);if(lane<0){lane=laneEnds.length;laneEnds.push(0)}seg.lane=lane;laneEnds[lane]=seg.startCol+seg.span-1});
    const weekHeight=Math.max(126,52+laneEnds.length*29);
    html+=`<div class="calendar-week" style="--week-height:${weekHeight}px">`;
    for(let i=0;i<7;i++){
      const d=new Date(weekStart);d.setDate(d.getDate()+i);const ds=fmt(d);
      html+=`<div class="cal-day-cell ${[0,6].includes(d.getDay())?'weekend':''} ${d.getMonth()!==first.getMonth()?'muted':''}"><div class="cal-num ${ds===fmt(TODAY)?'today':''}">${d.getDate()}</div></div>`;
    }
    segments.forEach(seg=>{
      const cls=catMap[seg.e.cat].cls;
      html+=`<div class="cal-event-span ${cls} ${seg.contBefore?'cont-before':''} ${seg.contAfter?'cont-after':''}" style="--col:${seg.startCol};--span:${seg.span};--lane:${seg.lane};background:${catMap[seg.e.cat].color}" data-name="${seg.e.name}" title="${seg.e.name} · ${seg.e.start} ~ ${seg.e.end}">${seg.e.name}</div>`;
    });
    html+='</div>';
  }
  html+='</div>';
  calendar.innerHTML=html;timeline.style.display='none';calendar.style.display='block';rangeLabel.textContent=`${first.getFullYear()}년 ${first.getMonth()+1}월 · 연속 일정 표시`;bindEvents();
}
function render(){renderStats();currentView==='timeline'?renderTimeline():renderCalendar()}
function bindEvents(){document.querySelectorAll('[data-name]').forEach(el=>el.onclick=()=>openModal(events.find(e=>e.name===el.dataset.name)))}
function openModal(e){const st=status(e),labels={live:'진행 중',upcoming:'예정',ended:'종료',invalid:'데이터 확인'};modalContent.innerHTML=`<div class="eyebrow">${e.cat}</div><h3>${e.name}</h3><span class="chip"><span class="dot" style="background:${catMap[e.cat].color}"></span>${labels[st]}</span><dl class="meta"><dt>시작일</dt><dd>${e.start}</dd><dt>종료일</dt><dd>${e.end==='2099-07-28'?'상시 운영 (원본 2099-07-28)':e.end}</dd><dt>기간</dt><dd>${st==='invalid'?'확인 필요':e.end==='2099-07-28'?'상시':Math.max(1,diff(e.start,e.end)+1)+'일'}</dd>${e.cat==='접속 이벤트'?'<dt>오픈 시각</dt><dd>13시부터 시작</dd>':''}</dl>${e.cat==='접속 이벤트'?'<div class="warning" style="border-color:rgba(125,211,252,.45);background:rgba(125,211,252,.08);color:#bfe3ff;">⏰ 접속 이벤트는 당일 <b>13시부터</b> 시작합니다.</div>':''}${st==='invalid'?'<div class="warning">종료일이 시작일보다 빠릅니다. 엑셀 원본의 날짜를 확인해 주세요.</div>':''}`;modal.classList.add('open')}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
search.oninput=render;statusSelect.onchange=render;monthSelect.onchange=e=>{currentMonth=e.target.value;render()};legend.onclick=e=>{const chip=e.target.closest('.chip');if(!chip)return;const c=chip.dataset.cat;activeCats.has(c)?activeCats.delete(c):activeCats.add(c);chip.classList.toggle('off');render()};document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;panelTitle.textContent=currentView==='timeline'?'통합 타임라인':'월간 캘린더';render()});todayBtn.onclick=()=>{currentMonth='2026-07';monthSelect.value=currentMonth;if(currentView==='calendar'){render();}else{render();setTimeout(()=>{const todayEl=document.querySelector('.day.today');if(todayEl)todayEl.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});},100);}toastMsg('오늘(2026-07-22)로 이동했습니다')};printBtn.onclick=()=>window.print();themeBtn.onclick=()=>{document.body.classList.toggle('light');themeBtn.textContent=document.body.classList.contains('light')?'☾ 어두운 화면':'☀︎ 밝은 화면'};closeModal.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});render();
</script>
